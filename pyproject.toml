[project]
name = "airspace"
version = "0.1.0"
description = "Local tracker for aircraft flying near a home point"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyproj>=3.6",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# FAA registry lookups through hangarbay's local DuckDB
enrich = ["duckdb>=1.0"]

[project.scripts]
airspace = "airspace.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
